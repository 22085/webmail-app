name: Build Webmail APK (manual)

on:
  workflow_dispatch: {}

concurrency:
  group: build-webmail-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build webmail APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew app:assembleRelease --stacktrace --no-daemon

      - name: List APK
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: webmail-1.0.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
