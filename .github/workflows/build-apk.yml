name: Build Webmail APK (manual)

on:
  workflow_dispatch: {}

concurrency:
  group: build-webmail-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build webmail APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        # 不用 android-actions/setup-android（它会装已废弃的 tools 包而失败）；
        # 直接用 runner 自带的 sdkmanager，只装项目要的三个包
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew app:assembleRelease --stacktrace --no-daemon

      - name: Sign APK with release keystore
        uses: akliuxingyuan/sign-android-release@v2.0.1
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.RELEASE_KEYSTORE }}
          keyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          ls -lh app/build/outputs/apk/release/
          APKSIGNER=$(find "$ANDROID_SDK_ROOT" /usr/local/lib/android /opt/android-sdk "$HOME/android-sdk" -path "*/build-tools/*/apksigner" -type f 2>/dev/null | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, installing build-tools via sdkmanager"
            SDK=$(find "$ANDROID_SDK_ROOT" /usr/local/lib/android /opt/android-sdk "$HOME/android-sdk" -maxdepth 1 -type d -name "*sdk*" 2>/dev/null | head -n 1)
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
            APKSIGNER=$(find "$SDK" -path "*/build-tools/*/apksigner" -type f 2>/dev/null | head -n 1)
          fi
          echo "apksigner: $APKSIGNER"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webmail-1.0.0-release.apk
          path: app/build/outputs/apk/release/app-release.apk
